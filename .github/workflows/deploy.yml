name: Sync knowledge base & backend deploy

# The frontend no longer deploys here — Vercel's own GitHub integration builds
# and deploys it on every push to main (taruni-portfolio.vercel.app). This
# workflow now only handles two things that are independent of that:
#  1. Regenerating backend/data/knowledge/{blog,lab}.json from MDX/source and
#     committing them back, so the knowledge base stays in sync.
#  2. The backend Docker build/deploy, which stays skipped until a real host
#     is configured (LIGHTSAIL_HOST secret).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: knowledge-sync
  cancel-in-progress: false

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            frontend:
              - 'frontend/src/**'
              - 'frontend/public/**'
              - 'frontend/package*.json'
              - 'frontend/next.config.*'
              - 'frontend/tailwind.config.*'
              - 'scripts/**'
              - 'backend/data/knowledge/*.json'
            backend:
              - 'backend/src/**'
              - 'backend/Dockerfile'
              - 'backend/pyproject.toml'
              - 'infra/**'
              - 'backend/data/knowledge/*.json'

  sync-knowledge:
    needs: detect-changes
    if: needs.detect-changes.outputs.frontend == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # sync-knowledge.mjs uses only Node built-ins — no install needed.
      - name: Regenerate and commit synced knowledge files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          node scripts/sync-knowledge.mjs
          git add backend/data/knowledge/blog.json backend/data/knowledge/lab.json frontend/src/data/knowledge/
          git diff --staged --quiet || (git commit -m "chore: sync knowledge base [skip ci]" && git pull --rebase --autostash && git push)

  build-backend:
    needs: detect-changes
    if: needs.detect-changes.outputs.backend == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      # Job-level `if:` can't reference the secrets context (GitHub Actions
      # rejects the whole workflow file with "Unrecognized named-value:
      # 'secrets'" if you try) — so the "is backend hosting configured" check
      # has to happen in a step instead, gating every step after it.
      - name: Check backend host configured
        id: gate
        run: echo "configured=${{ secrets.LIGHTSAIL_HOST != '' }}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.gate.outputs.configured == 'true'

      - name: Set up Docker Buildx
        if: steps.gate.outputs.configured == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: steps.gate.outputs.configured == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        if: steps.gate.outputs.configured == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          provenance: false
          tags: ghcr.io/${{ github.repository_owner }}/taruni-portfolio-backend:latest

  deploy-backend:
    needs: [detect-changes, build-backend]
    if: needs.detect-changes.outputs.backend == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Check backend host configured
        id: gate
        run: echo "configured=${{ secrets.LIGHTSAIL_HOST != '' }}" >> "$GITHUB_OUTPUT"

      - name: Deploy backend via SSH
        if: steps.gate.outputs.configured == 'true'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.LIGHTSAIL_SSH_KEY }}" > ~/.ssh/lightsail.pem
          chmod 600 ~/.ssh/lightsail.pem
          ssh -i ~/.ssh/lightsail.pem \
            -o StrictHostKeyChecking=no \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=20 \
            -o ConnectTimeout=30 \
            ubuntu@${{ secrets.LIGHTSAIL_HOST }} \
            "export GHCR_TOKEN='${GHCR_TOKEN}' GHCR_USER='${GHCR_USER}' && \
             cd /home/ubuntu/taruni-portfolio && \
             git fetch origin main && \
             git reset --hard origin/main && \
             bash infra/scripts/deploy.sh"
