<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" width="900" height="380" font-family="'Helvetica Neue', Arial, sans-serif">
  <rect width="900" height="380" fill="#ffffff"/>

  <!-- stage 1 -->
  <rect x="30" y="100" width="190" height="120" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="125" y="130" fill="#4b5563" font-size="13" font-weight="700" text-anchor="middle">Raw Source Data</text>
  <text x="125" y="152" fill="#6b7280" font-size="10.5" text-anchor="middle">500GB+ daily</text>
  <text x="125" y="168" fill="#6b7280" font-size="10.5" text-anchor="middle">multiple source systems</text>
  <text x="125" y="184" fill="#6b7280" font-size="10.5" text-anchor="middle">Azure Data Factory ingest</text>

  <line x1="220" y1="160" x2="252" y2="160" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#a3)"/>

  <!-- stage 2 -->
  <rect x="255" y="100" width="190" height="120" rx="8" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/>
  <text x="350" y="130" fill="#d97706" font-size="13" font-weight="700" text-anchor="middle">Cleansing &amp;</text>
  <text x="350" y="148" fill="#d97706" font-size="13" font-weight="700" text-anchor="middle">Validation</text>
  <text x="350" y="170" fill="#6b7280" font-size="10.5" text-anchor="middle">schema · completeness</text>
  <text x="350" y="186" fill="#6b7280" font-size="10.5" text-anchor="middle">duplicate · business-rule checks</text>
  <text x="350" y="202" fill="#9ca3af" font-size="10" text-anchor="middle">across 1M+ records</text>

  <line x1="445" y1="160" x2="477" y2="160" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#a3)"/>

  <!-- stage 3 -->
  <rect x="480" y="90" width="210" height="140" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="585" y="120" fill="#2563eb" font-size="13" font-weight="700" text-anchor="middle">PySpark Feature</text>
  <text x="585" y="138" fill="#2563eb" font-size="13" font-weight="700" text-anchor="middle">Engineering</text>
  <text x="585" y="160" fill="#6b7280" font-size="10.5" text-anchor="middle">rolling statistics, multi-window</text>
  <text x="585" y="176" fill="#6b7280" font-size="10.5" text-anchor="middle">categorical interaction terms</text>
  <text x="585" y="192" fill="#6b7280" font-size="10.5" text-anchor="middle">decay-weighted aggregates</text>
  <text x="585" y="212" fill="#9ca3af" font-size="10" text-anchor="middle">100+ model-ready features</text>

  <line x1="690" y1="160" x2="722" y2="160" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#a3)"/>

  <!-- stage 4 -->
  <rect x="725" y="100" width="150" height="120" rx="8" fill="#f4f4f8" stroke="#6b64d6" stroke-width="1.5"/>
  <text x="800" y="128" fill="#1f2937" font-size="12.5" font-weight="700" text-anchor="middle">Downstream</text>
  <text x="800" y="144" fill="#1f2937" font-size="12.5" font-weight="700" text-anchor="middle">ML Workloads</text>
  <text x="800" y="166" fill="#374151" font-size="10" text-anchor="middle">classification</text>
  <text x="800" y="180" fill="#374151" font-size="10" text-anchor="middle">forecasting</text>
  <text x="800" y="194" fill="#374151" font-size="10" text-anchor="middle">anomaly detection</text>
  <text x="800" y="208" fill="#374151" font-size="10" text-anchor="middle">predictive analytics</text>

  <text x="450" y="280" fill="#9ca3af" font-size="11" text-anchor="middle">One validated, reusable pipeline feeding every downstream workload —</text>
  <text x="450" y="298" fill="#9ca3af" font-size="11" text-anchor="middle">rather than each team deriving its own version of the same features.</text>

  <defs>
    <marker id="a3" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#9ca3af"/>
    </marker>
  </defs>
</svg>
