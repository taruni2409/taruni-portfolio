<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" width="900" height="460" font-family="'Helvetica Neue', Arial, sans-serif">
  <rect width="900" height="460" fill="#ffffff"/>

  <!-- Input -->
  <rect x="250" y="20" width="400" height="64" rx="8" fill="#f4f4f8" stroke="#6b64d6" stroke-width="1.5"/>
  <text x="450" y="46" fill="#1f2937" font-size="14" font-weight="700" text-anchor="middle">Price + Sentiment Features</text>
  <text x="450" y="64" fill="#6b7280" font-size="11" text-anchor="middle">lagged returns, rolling volatility, sentiment × mention volume</text>

  <line x1="450" y1="84" x2="450" y2="112" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#arrow2)"/>
  <line x1="450" y1="100" x2="140" y2="112" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#arrow2)"/>
  <line x1="450" y1="100" x2="340" y2="112" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#arrow2)"/>
  <line x1="450" y1="100" x2="560" y2="112" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#arrow2)"/>
  <line x1="450" y1="100" x2="760" y2="112" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#arrow2)"/>

  <!-- Four models -->
  <rect x="40" y="118" width="200" height="130" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="140" y="146" fill="#4b5563" font-size="13" font-weight="700" text-anchor="middle">GARCH(1,1)</text>
  <text x="140" y="168" fill="#6b7280" font-size="10.5" text-anchor="middle">econometric baseline</text>
  <text x="140" y="186" fill="#6b7280" font-size="10.5" text-anchor="middle">volatility clustering</text>
  <text x="140" y="210" fill="#9ca3af" font-size="10" text-anchor="middle">returns only —</text>
  <text x="140" y="226" fill="#9ca3af" font-size="10" text-anchor="middle">no sentiment features</text>

  <rect x="260" y="118" width="200" height="130" rx="8" fill="#ffffff" stroke="#059669" stroke-width="1.5"/>
  <text x="360" y="146" fill="#059669" font-size="13" font-weight="700" text-anchor="middle">Random Forest</text>
  <text x="360" y="168" fill="#6b7280" font-size="10.5" text-anchor="middle">nonlinear ensemble</text>
  <text x="360" y="186" fill="#6b7280" font-size="10.5" text-anchor="middle">full feature set</text>
  <text x="360" y="210" fill="#9ca3af" font-size="10" text-anchor="middle">price + sentiment</text>
  <text x="360" y="226" fill="#9ca3af" font-size="10" text-anchor="middle">+ interaction terms</text>

  <rect x="480" y="118" width="200" height="130" rx="8" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/>
  <text x="580" y="146" fill="#d97706" font-size="13" font-weight="700" text-anchor="middle">XGBoost</text>
  <text x="580" y="168" fill="#6b7280" font-size="10.5" text-anchor="middle">gradient-boosted trees</text>
  <text x="580" y="186" fill="#6b7280" font-size="10.5" text-anchor="middle">full feature set</text>
  <text x="580" y="210" fill="#9ca3af" font-size="10" text-anchor="middle">price + sentiment</text>
  <text x="580" y="226" fill="#9ca3af" font-size="10" text-anchor="middle">+ interaction terms</text>

  <rect x="700" y="118" width="200" height="130" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="800" y="146" fill="#2563eb" font-size="13" font-weight="700" text-anchor="middle">LSTM</text>
  <text x="800" y="168" fill="#6b7280" font-size="10.5" text-anchor="middle">sequence model</text>
  <text x="800" y="186" fill="#6b7280" font-size="10.5" text-anchor="middle">time-ordered windows</text>
  <text x="800" y="210" fill="#9ca3af" font-size="10" text-anchor="middle">captures temporal</text>
  <text x="800" y="226" fill="#9ca3af" font-size="10" text-anchor="middle">structure trees can't</text>

  <!-- converge -->
  <line x1="140" y1="248" x2="430" y2="310" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#arrow2)"/>
  <line x1="360" y1="248" x2="445" y2="310" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#arrow2)"/>
  <line x1="580" y1="248" x2="465" y2="310" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#arrow2)"/>
  <line x1="800" y1="248" x2="480" y2="310" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#arrow2)"/>

  <rect x="280" y="318" width="340" height="80" rx="8" fill="#f4f4f8" stroke="#6b64d6" stroke-width="1.5"/>
  <text x="450" y="346" fill="#1f2937" font-size="13" font-weight="700" text-anchor="middle">Same Held-Out Evaluation</text>
  <text x="450" y="366" fill="#374151" font-size="11" text-anchor="middle">chronological per-asset split · MAE, RMSE, R²</text>
  <text x="450" y="384" fill="#6b7280" font-size="10" text-anchor="middle">no random shuffling — no look-ahead bias</text>

  <text x="450" y="430" fill="#9ca3af" font-size="11" text-anchor="middle">MSc Data Science final project, University of Hertfordshire — ten major cryptocurrencies.</text>

  <defs>
    <marker id="arrow2" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#9ca3af"/>
    </marker>
  </defs>
</svg>
